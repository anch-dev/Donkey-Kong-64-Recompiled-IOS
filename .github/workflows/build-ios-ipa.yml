name: build-ios-ipa

on:
  push:
    branches: [iOS-port]
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: iOS-port

      - name: Download private ROM release asset
        env:
          GH_TOKEN: ${{ secrets.SECRET_TOKEN }}
          PRIVATE_REPO: ${{ secrets.SECRET_NAME }}
          ROM_RELEASE_TAG: Private-ROM
        run: |
          test -n "$GH_TOKEN"
          test -n "$PRIVATE_REPO"
          gh release download "$ROM_RELEASE_TAG" --repo "$PRIVATE_REPO" --pattern "donkeykong64.decompressed.us.z64" --dir .
          test -f donkeykong64.decompressed.us.z64

      - name: Expand DK64 compressed overlays
        run: |
          mv donkeykong64.decompressed.us.z64 donkeykong64.us.z64
          clang++ -std=c++17 -stdlib=libc++ decompressor.cpp -o dk64-decompressor -lz
          ./dk64-decompressor donkeykong64.us.z64
          test -f donkeykong64.decompressed.us.z64
          test "$(stat -f%z donkeykong64.decompressed.us.z64)" -gt 33554432
          rm -f donkeykong64.us.z64 dk64-decompressor

      - name: Install host build dependencies
        run: |
          brew install ninja llvm lld
          echo "LLVM_ROOT=$(brew --prefix llvm)" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Build N64Recomp and RSPRecomp
        env:
          N64RECOMP_COMMIT: 2b6f05688de2abc7d86da5b4a89b84c2c6acbabe
        run: |
          git clone https://github.com/Mr-Wiseguy/N64Recomp.git --recurse-submodules N64RecompSource
          cd N64RecompSource
          git checkout "$N64RECOMP_COMMIT"
          git submodule update --init --recursive

          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_MAKE_PROGRAM=ninja -G Ninja -S . -B cmake-build

          cmake --build cmake-build --config Release --target N64Recomp -j "$(sysctl -n hw.ncpu)"
          cmake --build cmake-build --config Release --target RSPRecomp -j "$(sysctl -n hw.ncpu)"

          mkdir -p ../host-tools
          cp cmake-build/N64Recomp ../host-tools/N64Recomp
          cp cmake-build/RSPRecomp ../host-tools/RSPRecomp
          chmod +x ../host-tools/N64Recomp ../host-tools/RSPRecomp

      - name: Generate recompiled game code
        run: |
          ./host-tools/N64Recomp us.toml
          ./host-tools/RSPRecomp n_aspMain.toml
          test -d RecompiledFuncs
          test -f rsp/n_aspMain.cpp

      - name: Remove ROM and recompiler sources
        run: |
          rm -f donkeykong64.decompressed.us.z64
          # Keep host-tools/N64Recomp: later steps and the Xcode PatchesLib phase run it to generate patch funcs.h.
          rm -f host-tools/RSPRecomp
          rm -rf N64RecompSource

      - name: Build SDL2 for iOS
        run: |
          SDL_VERSION=2.30.3
          curl -L "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz" -o SDL2.tar.gz
          tar -xzf SDL2.tar.gz
          cmake -S "SDL2-${SDL_VERSION}" -B SDL2-build -G Ninja             -DCMAKE_SYSTEM_NAME=iOS             -DCMAKE_OSX_SYSROOT=iphoneos             -DCMAKE_OSX_ARCHITECTURES=arm64             -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0             -DCMAKE_BUILD_TYPE=Release             -DSDL_TESTS=OFF             -DSDL_TESTS_ENABLED_BY_DEFAULT=OFF             -DSDL_SHARED=OFF             -DSDL_STATIC=ON             -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/SDL2-install"
          cmake --build SDL2-build --config Release -j "$(sysctl -n hw.ncpu)"
          cmake --install SDL2-build

      - name: Bootstrap vcpkg
        run: |
          ./lib/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          ./lib/vcpkg/vcpkg install --triplet arm64-ios

      - name: Disable native file dialogs for iOS RT64 build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/rt64/CMakeLists.txt")
          s = p.read_text()
          s = s.replace("add_subdirectory(src/contrib/nativefiledialog-extended)\n", "if (NOT CMAKE_SYSTEM_NAME STREQUAL \"iOS\")\n    add_subdirectory(src/contrib/nativefiledialog-extended)\nendif()\n")
          s = s.replace("target_link_libraries(rt64 nfd)\n", "if (NOT CMAKE_SYSTEM_NAME STREQUAL \"iOS\")\n    target_link_libraries(rt64 nfd)\nendif()\n")
          marker = "if (${RT64_STATIC})\n"
          insert = "if (CMAKE_SYSTEM_NAME STREQUAL \"iOS\")\n    list(REMOVE_ITEM SOURCES \"${PROJECT_SOURCE_DIR}/src/gui/rt64_file_dialog.cpp\")\nendif()\n\n"
          s = s.replace(marker, insert + marker, 1)
          p.write_text(s)
          PY

      - name: Pin RT64 mobile-compatible revision
        run: |
          git -C lib/rt64 fetch --depth=1 origin 5473732a822a4423b5696e7cb18fecc425a59875
          git -C lib/rt64 checkout --detach 5473732a822a4423b5696e7cb18fecc425a59875
          git -C lib/rt64 submodule update --init --recursive
          git -C lib/rt64/src/contrib/plume fetch --depth=1 origin d890ac899e505fb30040e037a4037cdeca68f033
          git -C lib/rt64/src/contrib/plume checkout --detach d890ac899e505fb30040e037a4037cdeca68f033
          git -C lib/rt64/src/contrib/plume reset --hard d890ac899e505fb30040e037a4037cdeca68f033

      - name: Patch RT64 Plume for iOS
        run: |
          PLUME="lib/rt64/src/contrib/plume"
          test "$(git -C "$PLUME" rev-parse HEAD)" = "d890ac899e505fb30040e037a4037cdeca68f033"
          test "$(git -C "$PLUME" hash-object plume_apple.mm)" = "1384fe9e1a5534356085a759cbf552ca95d4911d"
          test "$(git -C "$PLUME" hash-object plume_metal.cpp)" = "373c87e3403430d6686153efcb6a1a44a7f1a876"
          patch -d "$PLUME" -p1 -F 5 --batch --forward < "$GITHUB_WORKSPACE/.github/patches/plume-ios-metal.patch"

      - name: Configure host patch recompiler
        run: |
          test -x "$GITHUB_WORKSPACE/host-tools/N64Recomp"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("CMakeLists.txt")
          s = p.read_text()
          old = "COMMAND ./N64Recomp patches.toml"
          new = "COMMAND ${CMAKE_SOURCE_DIR}/host-tools/N64Recomp patches.toml"
          if s.count(old) != 1:
              raise SystemExit(f"Expected one patch recompiler command, found {s.count(old)}")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build host shader utilities
        run: |
          mkdir -p "$GITHUB_WORKSPACE/host-tools"
          clang++ -std=c++17 -O2 lib/rt64/src/tools/file_to_c/file_to_c.cpp -o "$GITHUB_WORKSPACE/host-tools/file_to_c"
          chmod +x "$GITHUB_WORKSPACE/host-tools/file_to_c"

          cmake -S lib/rt64/src/tools/spirv_cross_msl -B "$GITHUB_WORKSPACE/host-tools/spirv-cross" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
          cmake --build "$GITHUB_WORKSPACE/host-tools/spirv-cross" --config Release --target spirv_cross_msl -j "$(sysctl -n hw.ncpu)"
          test -x "lib/rt64/src/tools/spirv_cross_msl/build/bin/spirv_cross_msl"
          cp "lib/rt64/src/tools/spirv_cross_msl/build/bin/spirv_cross_msl" "$GITHUB_WORKSPACE/host-tools/spirv_cross_msl"
          chmod +x "$GITHUB_WORKSPACE/host-tools/spirv_cross_msl"

          echo "$GITHUB_WORKSPACE/host-tools" >> "$GITHUB_PATH"
          python3 - <<'PY'
          from pathlib import Path
          for name in ("CMakeLists.txt", "lib/rt64/CMakeLists.txt"):
              p = Path(name)
              s = p.read_text()
              s = s.replace("COMMAND $<TARGET_FILE:file_to_c> ", "COMMAND file_to_c ")
              s = s.replace(" DEPENDS ${OUTNAME}.spv file_to_c", " DEPENDS ${OUTNAME}.spv")
              s = s.replace(" DEPENDS ${OUTNAME}.dxil file_to_c", " DEPENDS ${OUTNAME}.dxil")
              s = s.replace(" DEPENDS ${OUTNAME}.metallib file_to_c", " DEPENDS ${OUTNAME}.metallib")
              s = s.replace(" DEPENDS ${OUTNAME}.rw file_to_c", " DEPENDS ${OUTNAME}.rw")
              s = s.replace(" DEPENDS ${OUTNAME}.spv spirv_cross_msl", " DEPENDS ${OUTNAME}.spv")
              s = s.replace("COMMAND xcrun -sdk macosx metal", "COMMAND xcrun -sdk iphoneos metal")
              s = s.replace("COMMAND xcrun -sdk macosx metallib", "COMMAND xcrun -sdk iphoneos metallib")
              p.write_text(s)
          PY

      - name: Disable iOS-incompatible mod folder launcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/RecompFrontend/recompui/src/composites/ui_mod_menu.cpp")
          lines = p.read_text().splitlines()
          apple_index = next(i for i, line in enumerate(lines) if line.strip() == "#elif defined(__APPLE__)")
          system_index = next(
              i for i in range(apple_index + 1, len(lines))
              if lines[i].strip() == "std::system(command.c_str());"
          )
          lines[system_index:system_index + 1] = [
              "#if !defined(__ENVIRONMENT_IPHONE_OS_VERSION_MIN_REQUIRED__)",
              lines[system_index],
              "#endif",
          ]
          p.write_text("\n".join(lines) + "\n")
          PY

      - name: Stub RT64 file dialog for iOS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/rt64/CMakeLists.txt")
          s = p.read_text()
          block = 'if (CMAKE_SYSTEM_NAME STREQUAL "iOS")\n    list(REMOVE_ITEM SOURCES "${PROJECT_SOURCE_DIR}/src/gui/rt64_file_dialog.cpp")\nendif()\n\n'
          if s.count(block) != 1:
              raise SystemExit("rt64_file_dialog REMOVE_ITEM block not found exactly once")
          p.write_text(s.replace(block, ""))
          PY
          cat > lib/rt64/src/gui/rt64_file_dialog.cpp <<'EOF'
          #include "rt64_file_dialog.h"

          namespace RT64 {
              std::atomic<bool> FileDialog::isOpen = false;
              void FileDialog::initialize() {}
              void FileDialog::finish() {}
              std::filesystem::path FileDialog::getDirectoryPath() { return {}; }
              std::filesystem::path FileDialog::getOpenFilename(const std::vector<FileFilter> &) { return {}; }
              std::filesystem::path FileDialog::getSaveFilename(const std::vector<FileFilter> &) { return {}; }
          }
          EOF

      - name: Patch RT64 Apple helper for iOS (no AppKit)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/rt64/src/apple/rt64_apple.mm")
          s = p.read_text()
          old = "#import <AppKit/AppKit.h>\n"
          if s.count(old) != 1:
              raise SystemExit("AppKit import not found exactly once in rt64_apple.mm")
          s = s.replace(old, "#import <TargetConditionals.h>\n#if TARGET_OS_OSX\n#import <AppKit/AppKit.h>\n#endif\n")
          p.write_text(s)
          PY

      - name: Patch sljit Apple allocator for iOS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/N64ModernRuntime/N64Recomp/lib/sljit/sljit_src/allocator_src/sljitExecAllocatorApple.c")
          s = p.read_text()
          marker = "#else /* !TARGET_OS_OSX */\n"
          if s.count(marker) != 1:
              raise SystemExit("sljit Apple allocator marker not found exactly once")
          s = s.replace(marker, marker + "\n#ifndef SLJIT_UPDATE_WX_FLAGS\n#define SLJIT_UPDATE_WX_FLAGS(from, to, enable_exec)\n#endif\n")
          p.write_text(s)
          PY

      - name: Configure iOS
        run: |
          cmake -S . -B cmake-build-ios -G Xcode             -DCMAKE_SYSTEM_NAME=iOS             -DCMAKE_OSX_SYSROOT=iphoneos             -DCMAKE_OSX_ARCHITECTURES=arm64             -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/SDL2-install;$GITHUB_WORKSPACE/lib/vcpkg/installed/arm64-ios"             -DSDL2_DIR="$GITHUB_WORKSPACE/SDL2-install/lib/cmake/SDL2"             -DPATCHES_C_COMPILER="$LLVM_ROOT/bin/clang"             -DPATCHES_LD="$(brew --prefix lld)/bin/ld.lld"             -DCMAKE_CXX_FLAGS="-DRECOMP_IOS=1"

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          cmake --build cmake-build-ios --config Release --target DK64Recompiled -j 2 -- CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          test -f build.log || exit 0
          enc() { sed 's/%/%25/g' | cut -c1-260 | awk '{printf "%s%%0A", $0}'; }
          FAILED="$(grep -n -A8 'The following build commands failed' build.log | enc)"
          echo "::error title=failed build commands::${FAILED:0:3500}"
          ERRS="$(grep -n -E ' error: |fatal error:|Undefined symbols|ld: error' build.log | grep -v 'warning:' | awk '!seen[$0]++' | head -15 | enc)"
          echo "::error title=compiler errors::${ERRS:0:6000}"
          U="$(grep -n 'Undefined symbols for architecture' build.log | head -1 | cut -d: -f1)"
          if [ -n "$U" ]; then
            UND="$(sed -n "${U},$((U+45))p" build.log | enc)"
            echo "::error title=undefined symbols::${UND:0:8000}"
          fi
          N="$(grep -n 'Command PhaseScriptExecution failed' build.log | head -1 | cut -d: -f1)"
          if [ -n "$N" ]; then
            S=$(( N > 45 ? N - 45 : 1 ))
            CTX="$(sed -n "${S},${N}p" build.log | enc)"
            echo "::error title=before first PhaseScriptExecution failure::${CTX:0:7000}"
          fi

      - name: Assemble app resources
        run: |
          APP="$(find cmake-build-ios -type d -name 'DK64Recompiled.app' -print -quit)"
          test -n "$APP"
          mkdir -p "$APP/assets"
          cp -R assets/. "$APP/assets/"
          cp recompcontrollerdb.txt "$APP/"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Package unsigned IPA
        run: |
          rm -rf ipa
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/DK64Recompiled.app
          (cd ipa && /usr/bin/zip -qry ../DK64Recompiled-iOS-unsigned.ipa Payload)
          unzip -l "DK64Recompiled-iOS-unsigned.ipa" | head -40

      - name: Verify IPA contents
        if: always()
        run: |
          IPA=DK64Recompiled-iOS-unsigned.ipa
          {
            echo "APP=$APP"
            ls -l "$IPA" || echo "IPA FILE MISSING"
            unzip -tq "$IPA" | tail -1
            unzip -l "$IPA" | tail -1
            unzip -l "$IPA" | awk 'NR>3 {print $1, $4}' | sort -rn | head -12
            BIN="$APP/DK64Recompiled"
            ls -l "$BIN"
            file "$BIN"
            lipo -info "$BIN" 2>&1
            plutil -lint "$APP/Info.plist"
            du -sh "$APP" "$APP/assets"
          } > ipa-report.txt 2>&1 || true
          MSG="$(sed 's/%/%25/g' ipa-report.txt | cut -c1-200 | awk '{printf "%s%%0A", $0}')"
          echo "::notice title=IPA report::${MSG:0:6000}"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DK64Recompiled-iOS-unsigned
          path: DK64Recompiled-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DK64Recompiled-iOS-build-diagnostics
          path: |
            build.log
            cmake-build-ios/CMakeCache.txt
            cmake-build-ios/**/*.log
          if-no-files-found: ignore
          retention-days: 7
