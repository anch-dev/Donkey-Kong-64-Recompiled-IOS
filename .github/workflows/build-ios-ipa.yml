name: build-ios-ipa

on:
  push:
    branches: [iOS-port]
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: iOS-port

      - name: Download private ROM release asset
        env:
          GH_TOKEN: ${{ secrets.SECRET_TOKEN }}
          PRIVATE_REPO: ${{ secrets.SECRET_NAME }}
          ROM_RELEASE_TAG: Private-ROM
        run: |
          test -n "$GH_TOKEN"
          test -n "$PRIVATE_REPO"
          gh release download "$ROM_RELEASE_TAG" --repo "$PRIVATE_REPO" --pattern "donkeykong64.decompressed.us.z64" --dir .
          test -f donkeykong64.decompressed.us.z64

      - name: Expand DK64 compressed overlays
        run: |
          mv donkeykong64.decompressed.us.z64 donkeykong64.us.z64
          clang++ -std=c++17 -stdlib=libc++ decompressor.cpp -o dk64-decompressor -lz
          ./dk64-decompressor donkeykong64.us.z64
          test -f donkeykong64.decompressed.us.z64
          test "$(stat -f%z donkeykong64.decompressed.us.z64)" -gt 33554432
          rm -f donkeykong64.us.z64 dk64-decompressor

      - name: Install host build dependencies
        run: |
          brew install ninja llvm lld
          echo "LLVM_ROOT=$(brew --prefix llvm)" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Build N64Recomp and RSPRecomp
        env:
          N64RECOMP_COMMIT: 2b6f05688de2abc7d86da5b4a89b84c2c6acbabe
        run: |
          git clone https://github.com/Mr-Wiseguy/N64Recomp.git --recurse-submodules N64RecompSource
          cd N64RecompSource
          git checkout "$N64RECOMP_COMMIT"
          git submodule update --init --recursive

          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_MAKE_PROGRAM=ninja -G Ninja -S . -B cmake-build

          cmake --build cmake-build --config Release --target N64Recomp -j "$(sysctl -n hw.ncpu)"
          cmake --build cmake-build --config Release --target RSPRecomp -j "$(sysctl -n hw.ncpu)"

          mkdir -p ../host-tools
          cp cmake-build/N64Recomp ../host-tools/N64Recomp
          cp cmake-build/RSPRecomp ../host-tools/RSPRecomp
          chmod +x ../host-tools/N64Recomp ../host-tools/RSPRecomp

      - name: Generate recompiled game code
        run: |
          ./host-tools/N64Recomp us.toml
          ./host-tools/RSPRecomp n_aspMain.toml
          test -d RecompiledFuncs
          test -f rsp/n_aspMain.cpp

      - name: Remove ROM and recompiler sources
        run: |
          rm -f donkeykong64.decompressed.us.z64
          # Keep host-tools/N64Recomp: later steps and the Xcode PatchesLib phase run it to generate patch funcs.h.
          rm -f host-tools/RSPRecomp
          rm -rf N64RecompSource

      - name: Build SDL2 for iOS
        run: |
          SDL_VERSION=2.30.3
          curl -L "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz" -o SDL2.tar.gz
          tar -xzf SDL2.tar.gz
          cmake -S "SDL2-${SDL_VERSION}" -B SDL2-build -G Ninja             -DCMAKE_SYSTEM_NAME=iOS             -DCMAKE_OSX_SYSROOT=iphoneos             -DCMAKE_OSX_ARCHITECTURES=arm64             -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0             -DCMAKE_BUILD_TYPE=Release             -DSDL_TESTS=OFF             -DSDL_TESTS_ENABLED_BY_DEFAULT=OFF             -DSDL_SHARED=OFF             -DSDL_STATIC=ON             -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/SDL2-install"
          cmake --build SDL2-build --config Release -j "$(sysctl -n hw.ncpu)"
          cmake --install SDL2-build

      - name: Bootstrap vcpkg
        run: |
          ./lib/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          ./lib/vcpkg/vcpkg install --triplet arm64-ios

      - name: Disable native file dialogs for iOS RT64 build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/rt64/CMakeLists.txt")
          s = p.read_text()
          s = s.replace("add_subdirectory(src/contrib/nativefiledialog-extended)\n", "if (NOT CMAKE_SYSTEM_NAME STREQUAL \"iOS\")\n    add_subdirectory(src/contrib/nativefiledialog-extended)\nendif()\n")
          s = s.replace("target_link_libraries(rt64 nfd)\n", "if (NOT CMAKE_SYSTEM_NAME STREQUAL \"iOS\")\n    target_link_libraries(rt64 nfd)\nendif()\n")
          marker = "if (${RT64_STATIC})\n"
          insert = "if (CMAKE_SYSTEM_NAME STREQUAL \"iOS\")\n    list(REMOVE_ITEM SOURCES \"${PROJECT_SOURCE_DIR}/src/gui/rt64_file_dialog.cpp\")\nendif()\n\n"
          s = s.replace(marker, insert + marker, 1)
          p.write_text(s)
          PY

      - name: Pin RT64 mobile-compatible revision
        run: |
          git -C lib/rt64 fetch --depth=1 origin 5473732a822a4423b5696e7cb18fecc425a59875
          git -C lib/rt64 checkout --detach 5473732a822a4423b5696e7cb18fecc425a59875
          git -C lib/rt64 submodule update --init --recursive
          git -C lib/rt64/src/contrib/plume fetch --depth=1 origin d890ac899e505fb30040e037a4037cdeca68f033
          git -C lib/rt64/src/contrib/plume checkout --detach d890ac899e505fb30040e037a4037cdeca68f033
          git -C lib/rt64/src/contrib/plume reset --hard d890ac899e505fb30040e037a4037cdeca68f033

      - name: Patch RT64 Plume for iOS
        run: |
          PLUME="lib/rt64/src/contrib/plume"
          test "$(git -C "$PLUME" rev-parse HEAD)" = "d890ac899e505fb30040e037a4037cdeca68f033"
          test "$(git -C "$PLUME" hash-object plume_apple.mm)" = "1384fe9e1a5534356085a759cbf552ca95d4911d"
          test "$(git -C "$PLUME" hash-object plume_metal.cpp)" = "373c87e3403430d6686153efcb6a1a44a7f1a876"
          patch -d "$PLUME" -p1 -F 5 --batch --forward < "$GITHUB_WORKSPACE/.github/patches/plume-ios-metal.patch"


      - name: Size the Metal swap chain from the screen's native scale (any iPhone/iPad)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/rt64/src/contrib/plume/plume_apple.mm")
          s = p.read_text()
          old = (
              "        CGFloat scaleFactor = view.contentScaleFactor;\n"
              "        if (scaleFactor <= 0) {\n"
              "            scaleFactor = UIScreen.mainScreen.scale;\n"
              "        }\n"
          )
          if s.count(old) != 1:
              raise SystemExit("plume scale anchor not found exactly once")
          new = (
              "        // Use the screen's NATIVE pixel scale (iPhone ~3x, iPad 2x, zoomed display modes included).\n"
              "        // view.contentScaleFactor reports 1.0 for SDL's window (and inside LiveContainer), which made the\n"
              "        // swap chain 1x and the whole UI blurry and mis-scaled.\n"
              "        UIScreen *screen = view.window.screen;\n"
              "        if (screen == nil && [view isKindOfClass:[UIWindow class]]) {\n"
              "            screen = ((UIWindow *)view).screen;\n"
              "        }\n"
              "        if (screen == nil) {\n"
              "            screen = UIScreen.mainScreen;\n"
              "        }\n"
              "        CGFloat scaleFactor = screen.nativeScale > 0 ? screen.nativeScale : screen.scale;\n"
              "        if (scaleFactor <= 0) {\n"
              "            scaleFactor = view.contentScaleFactor > 0 ? view.contentScaleFactor : 1.0;\n"
              "        }\n"
          )
          p.write_text(s.replace(old, new))
          PY
      - name: Configure host patch recompiler
        run: |
          test -x "$GITHUB_WORKSPACE/host-tools/N64Recomp"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("CMakeLists.txt")
          s = p.read_text()
          old = "COMMAND ./N64Recomp patches.toml"
          new = "COMMAND ${CMAKE_SOURCE_DIR}/host-tools/N64Recomp patches.toml"
          if s.count(old) != 1:
              raise SystemExit(f"Expected one patch recompiler command, found {s.count(old)}")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build host shader utilities
        run: |
          mkdir -p "$GITHUB_WORKSPACE/host-tools"
          clang++ -std=c++17 -O2 lib/rt64/src/tools/file_to_c/file_to_c.cpp -o "$GITHUB_WORKSPACE/host-tools/file_to_c"
          chmod +x "$GITHUB_WORKSPACE/host-tools/file_to_c"

          cmake -S lib/rt64/src/tools/spirv_cross_msl -B "$GITHUB_WORKSPACE/host-tools/spirv-cross" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
          cmake --build "$GITHUB_WORKSPACE/host-tools/spirv-cross" --config Release --target spirv_cross_msl -j "$(sysctl -n hw.ncpu)"
          test -x "lib/rt64/src/tools/spirv_cross_msl/build/bin/spirv_cross_msl"
          cp "lib/rt64/src/tools/spirv_cross_msl/build/bin/spirv_cross_msl" "$GITHUB_WORKSPACE/host-tools/spirv_cross_msl"
          chmod +x "$GITHUB_WORKSPACE/host-tools/spirv_cross_msl"

          echo "$GITHUB_WORKSPACE/host-tools" >> "$GITHUB_PATH"
          python3 - <<'PY'
          from pathlib import Path
          for name in ("CMakeLists.txt", "lib/rt64/CMakeLists.txt"):
              p = Path(name)
              s = p.read_text()
              s = s.replace("COMMAND $<TARGET_FILE:file_to_c> ", "COMMAND file_to_c ")
              s = s.replace(" DEPENDS ${OUTNAME}.spv file_to_c", " DEPENDS ${OUTNAME}.spv")
              s = s.replace(" DEPENDS ${OUTNAME}.dxil file_to_c", " DEPENDS ${OUTNAME}.dxil")
              s = s.replace(" DEPENDS ${OUTNAME}.metallib file_to_c", " DEPENDS ${OUTNAME}.metallib")
              s = s.replace(" DEPENDS ${OUTNAME}.rw file_to_c", " DEPENDS ${OUTNAME}.rw")
              s = s.replace(" DEPENDS ${OUTNAME}.spv spirv_cross_msl", " DEPENDS ${OUTNAME}.spv")
              s = s.replace("COMMAND xcrun -sdk macosx metal", "COMMAND xcrun -sdk iphoneos metal")
              s = s.replace("COMMAND xcrun -sdk macosx metallib", "COMMAND xcrun -sdk iphoneos metallib")
              p.write_text(s)
          PY

      - name: Disable iOS-incompatible mod folder launcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/RecompFrontend/recompui/src/composites/ui_mod_menu.cpp")
          lines = p.read_text().splitlines()
          apple_index = next(i for i, line in enumerate(lines) if line.strip() == "#elif defined(__APPLE__)")
          system_index = next(
              i for i in range(apple_index + 1, len(lines))
              if lines[i].strip() == "std::system(command.c_str());"
          )
          lines[system_index:system_index + 1] = [
              "#if !defined(__ENVIRONMENT_IPHONE_OS_VERSION_MIN_REQUIRED__)",
              lines[system_index],
              "#endif",
          ]
          p.write_text("\n".join(lines) + "\n")
          PY

      - name: Stub RT64 file dialog for iOS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/rt64/CMakeLists.txt")
          s = p.read_text()
          block = 'if (CMAKE_SYSTEM_NAME STREQUAL "iOS")\n    list(REMOVE_ITEM SOURCES "${PROJECT_SOURCE_DIR}/src/gui/rt64_file_dialog.cpp")\nendif()\n\n'
          if s.count(block) != 1:
              raise SystemExit("rt64_file_dialog REMOVE_ITEM block not found exactly once")
          p.write_text(s.replace(block, ""))
          PY
          cat > lib/rt64/src/gui/rt64_file_dialog.cpp <<'EOF'
          #include "rt64_file_dialog.h"

          namespace RT64 {
              std::atomic<bool> FileDialog::isOpen = false;
              void FileDialog::initialize() {}
              void FileDialog::finish() {}
              std::filesystem::path FileDialog::getDirectoryPath() { return {}; }
              std::filesystem::path FileDialog::getOpenFilename(const std::vector<FileFilter> &) { return {}; }
              std::filesystem::path FileDialog::getSaveFilename(const std::vector<FileFilter> &) { return {}; }
          }
          EOF

      - name: Use the asynchronous iOS ROM picker in the launcher file dialog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/RecompFrontend/recompui/src/util/file.cpp")
          s = p.read_text()
          old = (
              "#ifdef __APPLE__\n"
              "        file::apple::dispatch_on_ui_thread([callback]() {\n"
              "            perform_file_dialog_operation(callback);\n"
              "        });\n"
          )
          if s.count(old) != 1:
              raise SystemExit("open_file_dialog Apple block not found exactly once")
          new = (
              "#if defined(__APPLE__) && TARGET_OS_IPHONE\n"
              "        // iOS: asynchronous picker. Presents from SDL's view controller and returns immediately; the completion is\n"
              "        // called later on the main thread with a local, app-controlled copy of the ROM.\n"
              "        auto* heap_callback = new std::function<void(bool, const std::filesystem::path&)>(callback);\n"
              "        dk64_ios_pick_rom_async([](void* context, int success, const char* path) {\n"
              "            auto* cb = static_cast<std::function<void(bool, const std::filesystem::path&)>*>(context);\n"
              "            (*cb)(success != 0, success != 0 ? std::filesystem::path{path} : std::filesystem::path{});\n"
              "            delete cb;\n"
              "        }, heap_callback);\n"
              "#elif defined(__APPLE__)\n"
              "        file::apple::dispatch_on_ui_thread([callback]() {\n"
              "            perform_file_dialog_operation(callback);\n"
              "        });\n"
          )
          s = s.replace(old, new)
          decl = (
              "#ifdef __APPLE__\n"
              "#include <TargetConditionals.h>\n"
              "#if TARGET_OS_IPHONE\n"
              "extern \"C\" void dk64_ios_pick_rom_async(void (*done)(void*, int, const char*), void* context);\n"
              "#endif\n"
              "#endif\n"
          )
          marker = "namespace recompui {"
          idx = s.index(marker)
          s = s[:idx] + decl + "\n" + s[idx:]
          p.write_text(s)
          PY

      - name: Add a pressed (recessed) state to launcher buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h = Path("lib/RecompFrontend/recompui/src/base/ui_game_option.h")
          c = Path("lib/RecompFrontend/recompui/src/base/ui_game_option.cpp")
          hs, cs = h.read_text(), c.read_text()

          def swap(text, old, new):
              if text.count(old) != 1:
                  raise SystemExit("patch anchor not found exactly once: " + old[:60])
              return text.replace(old, new)

          hs = swap(hs, "        Style hover_disabled_style;\n", "        Style hover_disabled_style;\n        Style pressed_style;\n")
          cs = swap(cs, "Events(EventType::Click, EventType::Hover, EventType::Enable, EventType::Focus)",
                        "Events(EventType::Click, EventType::Hover, EventType::Enable, EventType::Focus, EventType::MouseButton)")
          cs = swap(cs, "        add_style(&hover_disabled_style, { hover_state, disabled_state });\n",
                        "        add_style(&hover_disabled_style, { hover_state, disabled_state });\n"
                        "        // Pressed = physically pushed in: shifted down, darker, dimmer text. Distinct from hover/focus.\n"
                        "        pressed_style.set_translate_2D(0.0f, 5.0f);\n"
                        "        pressed_style.set_background_color(Color{ 0x1C, 0x0C, 0x02, 0xF0 });\n"
                        "        pressed_style.set_color(Color{ 0xE0, 0xB0, 0x30, 0xFF });\n"
                        "        add_style(&pressed_style, \"pressed\");\n")
          cs = swap(cs, "            set_style_enabled(hover_state, std::get<EventHover>(e.variant).active && is_enabled());\n",
                        "            set_style_enabled(hover_state, std::get<EventHover>(e.variant).active && is_enabled());\n"
                        "            if (!std::get<EventHover>(e.variant).active) {\n"
                        "                set_style_enabled(\"pressed\", false);  // finger/pointer slid off while held\n"
                        "            }\n")
          cs = swap(cs, "        case EventType::Enable:\n            {\n                bool enable_active",
                        "        case EventType::MouseButton: {\n"
                        "            const auto& mouse = std::get<EventMouseButton>(e.variant);\n"
                        "            if (mouse.button == MouseButton::Left) {\n"
                        "                set_style_enabled(\"pressed\", mouse.pressed && is_enabled());\n"
                        "            }\n"
                        "            break;\n"
                        "        }\n"
                        "        case EventType::Enable:\n            {\n                bool enable_active")
          h.write_text(hs)
          c.write_text(cs)
          PY

      - name: Make touch behave as a mouse in RmlUi menus (iOS)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/RecompFrontend/recompui/src/base/ui_state.cpp")
          s = p.read_text()
          marker = "            // Send the event to RmlUi if this type of event is being captured.\n"
          if s.count(marker) != 1:
              raise SystemExit("RmlUi dispatch marker not found exactly once")
          patch = (
              "#if defined(DK64_IOS) || defined(__ENVIRONMENT_IPHONE_OS_VERSION_MIN_REQUIRED__)\n"
              "            {\n"
              "                // SDL turns finger touches into mouse events (which == SDL_TOUCH_MOUSEID). RmlUi button events carry no\n"
              "                // position, so a tap needs a preceding pointer move to the finger, and the 'mouse inactive' / 'controller\n"
              "                // active' filters above must not swallow touches.\n"
              "                static bool touch_down = false;\n"
              "                static bool touch_scrolling = false;\n"
              "                static int touch_start_x = 0;\n"
              "                static int touch_start_y = 0;\n"
              "                static int touch_last_y = 0;\n"
              "                static int touch_log_budget = 60;\n"
              "                const bool touch_motion = cur_event.type == SDL_EventType::SDL_MOUSEMOTION && cur_event.motion.which == SDL_TOUCH_MOUSEID;\n"
              "                const bool touch_button = (cur_event.type == SDL_EventType::SDL_MOUSEBUTTONDOWN || cur_event.type == SDL_EventType::SDL_MOUSEBUTTONUP) && cur_event.button.which == SDL_TOUCH_MOUSEID;\n"
              "                const bool touch_mouse = touch_motion || touch_button;\n"
              "                const bool is_pointer_event = cur_event.type == SDL_EventType::SDL_MOUSEMOTION || cur_event.type == SDL_EventType::SDL_MOUSEBUTTONDOWN || cur_event.type == SDL_EventType::SDL_MOUSEBUTTONUP;\n"
              "                if (touch_mouse) {\n"
              "                    is_mouse_input = true;\n"
              "                    if (cur_event.type != SDL_EventType::SDL_MOUSEBUTTONUP) {\n"
              "                        mouse_moved = true;\n"
              "                        mouse_clicked = true;\n"
              "                    }\n"
              "                }\n"
              "                float touch_scale_y = 1.0f;\n"
              "                if (is_pointer_event && (is_mouse_input || touch_mouse)) {\n"
              "                    // SDL reports window coordinates in points. The RmlUi context lives in the renderer's swap chain\n"
              "                    // framebuffer space, which on iOS is not necessarily the window's pixel size, so map by asking the\n"
              "                    // context for its size instead of assuming pixels (assuming 3x pushed every tap off screen).\n"
              "                    int lw = 0, lh = 0;\n"
              "                    SDL_GetWindowSize(window, &lw, &lh);\n"
              "                    const Rml::Vector2i ctx_dims = ui_state->context->GetDimensions();\n"
              "                    float sx = 1.0f, sy = 1.0f;\n"
              "                    if (lw > 0 && lh > 0 && ctx_dims.x > 0 && ctx_dims.y > 0) {\n"
              "                        sx = (float)ctx_dims.x / (float)lw;\n"
              "                        sy = (float)ctx_dims.y / (float)lh;\n"
              "                    }\n"
              "                    touch_scale_y = sy;\n"
              "                    const int raw_x = cur_event.type == SDL_EventType::SDL_MOUSEMOTION ? cur_event.motion.x : cur_event.button.x;\n"
              "                    const int raw_y = cur_event.type == SDL_EventType::SDL_MOUSEMOTION ? cur_event.motion.y : cur_event.button.y;\n"
              "                    if (cur_event.type == SDL_EventType::SDL_MOUSEMOTION) {\n"
              "                        cur_event.motion.x = (Sint32)(cur_event.motion.x * sx);\n"
              "                        cur_event.motion.y = (Sint32)(cur_event.motion.y * sy);\n"
              "                    } else {\n"
              "                        cur_event.button.x = (Sint32)(cur_event.button.x * sx);\n"
              "                        cur_event.button.y = (Sint32)(cur_event.button.y * sy);\n"
              "                    }\n"
              "                    if (touch_mouse && touch_log_budget > 0) {\n"
              "                        touch_log_budget--;\n"
              "                        SDL_Log(\"TOUCHUI type=%d raw=(%d,%d) mapped=(%d,%d) window=%dx%d context=%dx%d scale=%.3f capturing_mouse=%d\", (int)cur_event.type, raw_x, raw_y, (int)(raw_x * sx), (int)(raw_y * sy), lw, lh, ctx_dims.x, ctx_dims.y, sx, (int)context_capturing_mouse);\n"
              "                    }\n"
              "                }\n"
              "                if (touch_mouse && context_capturing_mouse) {\n"
              "                    const int cur_x = touch_motion ? cur_event.motion.x : cur_event.button.x;\n"
              "                    const int cur_y = touch_motion ? cur_event.motion.y : cur_event.button.y;\n"
              "                    if (cur_event.type == SDL_EventType::SDL_MOUSEBUTTONDOWN) {\n"
              "                        touch_down = true;\n"
              "                        touch_scrolling = false;\n"
              "                        touch_start_x = cur_x;\n"
              "                        touch_start_y = cur_y;\n"
              "                        touch_last_y = cur_y;\n"
              "                        ui_state->context->ProcessMouseMove(cur_x, cur_y, 0);\n"
              "                    } else if (touch_motion && touch_down) {\n"
              "                        // A mostly-vertical drag scrolls the list under the finger (mod menu, settings) instead of\n"
              "                        // moving the pointer, and does not turn into a click when the finger lifts.\n"
              "                        int ady = cur_y - touch_start_y;\n"
              "                        if (ady < 0) ady = -ady;\n"
              "                        int adx = cur_x - touch_start_x;\n"
              "                        if (adx < 0) adx = -adx;\n"
              "                        if (!touch_scrolling && (float)ady > 10.0f * touch_scale_y && ady > adx) {\n"
              "                            touch_scrolling = true;\n"
              "                        }\n"
              "                        if (touch_scrolling) {\n"
              "                            const int delta = cur_y - touch_last_y;\n"
              "                            touch_last_y = cur_y;\n"
              "                            Rml::Element* scroll_target = ui_state->context->GetElementAtPoint(Rml::Vector2f((float)touch_start_x, (float)touch_start_y));\n"
              "                            while (scroll_target != nullptr) {\n"
              "                                const Rml::Style::Overflow overflow_y = scroll_target->GetComputedValues().overflow_y();\n"
              "                                if ((overflow_y == Rml::Style::Overflow::Auto || overflow_y == Rml::Style::Overflow::Scroll) && scroll_target->GetScrollHeight() > scroll_target->GetClientHeight() + 1.0f) {\n"
              "                                    scroll_target->SetScrollTop(scroll_target->GetScrollTop() - (float)delta);\n"
              "                                    break;\n"
              "                                }\n"
              "                                scroll_target = scroll_target->GetParentNode();\n"
              "                            }\n"
              "                            continue;\n"
              "                        }\n"
              "                    } else if (cur_event.type == SDL_EventType::SDL_MOUSEBUTTONUP) {\n"
              "                        if (touch_scrolling) {\n"
              "                            ui_state->context->ProcessMouseLeave();\n"
              "                        } else {\n"
              "                            ui_state->context->ProcessMouseMove(cur_x, cur_y, 0);\n"
              "                        }\n"
              "                        touch_down = false;\n"
              "                        touch_scrolling = false;\n"
              "                    }\n"
              "                }\n"
              "            }\n"
              "#endif\n"
          )
          p.write_text(s.replace(marker, patch + marker, 1))
          PY

      - name: Patch RT64 Apple helper for iOS (no AppKit)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/rt64/src/apple/rt64_apple.mm")
          s = p.read_text()
          old = "#import <AppKit/AppKit.h>\n"
          if s.count(old) != 1:
              raise SystemExit("AppKit import not found exactly once in rt64_apple.mm")
          s = s.replace(old, "#import <TargetConditionals.h>\n#if TARGET_OS_OSX\n#import <AppKit/AppKit.h>\n#endif\n")
          p.write_text(s)
          PY

      - name: Patch sljit Apple allocator for iOS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/N64ModernRuntime/N64Recomp/lib/sljit/sljit_src/allocator_src/sljitExecAllocatorApple.c")
          s = p.read_text()
          marker = "#else /* !TARGET_OS_OSX */\n"
          if s.count(marker) != 1:
              raise SystemExit("sljit Apple allocator marker not found exactly once")
          s = s.replace(marker, marker + "\n#ifndef SLJIT_UPDATE_WX_FLAGS\n#define SLJIT_UPDATE_WX_FLAGS(from, to, enable_exec)\n#endif\n")
          p.write_text(s)
          PY

      - name: Configure iOS
        run: |
          cmake -S . -B cmake-build-ios -G Xcode             -DCMAKE_SYSTEM_NAME=iOS             -DCMAKE_OSX_SYSROOT=iphoneos             -DCMAKE_OSX_ARCHITECTURES=arm64             -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/SDL2-install;$GITHUB_WORKSPACE/lib/vcpkg/installed/arm64-ios"             -DSDL2_DIR="$GITHUB_WORKSPACE/SDL2-install/lib/cmake/SDL2"             -DPATCHES_C_COMPILER="$LLVM_ROOT/bin/clang"             -DPATCHES_LD="$(brew --prefix lld)/bin/ld.lld"             -DCMAKE_CXX_FLAGS="-DRECOMP_IOS=1"

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          cmake --build cmake-build-ios --config Release --target DK64Recompiled -j 2 -- CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          test -f build.log || exit 0
          enc() { sed 's/%/%25/g' | cut -c1-260 | awk '{printf "%s%%0A", $0}'; }
          FAILED="$(grep -n -A8 'The following build commands failed' build.log | enc)"
          echo "::error title=failed build commands::${FAILED:0:3500}"
          ERRS="$(grep -n -E ' error: |fatal error:|Undefined symbols|ld: error' build.log | grep -v 'warning:' | awk '!seen[$0]++' | head -15 | enc)"
          echo "::error title=compiler errors::${ERRS:0:6000}"
          U="$(grep -n 'Undefined symbols for architecture' build.log | head -1 | cut -d: -f1)"
          if [ -n "$U" ]; then
            UND="$(sed -n "${U},$((U+45))p" build.log | enc)"
            echo "::error title=undefined symbols::${UND:0:8000}"
          fi
          N="$(grep -n 'Command PhaseScriptExecution failed' build.log | head -1 | cut -d: -f1)"
          if [ -n "$N" ]; then
            S=$(( N > 45 ? N - 45 : 1 ))
            CTX="$(sed -n "${S},${N}p" build.log | enc)"
            echo "::error title=before first PhaseScriptExecution failure::${CTX:0:7000}"
          fi

      - name: Assemble app resources
        run: |
          APP="$(find cmake-build-ios -type d -name 'DK64Recompiled.app' -print -quit)"
          test -n "$APP"
          mkdir -p "$APP/assets"
          cp -R assets/. "$APP/assets/"
          cp recompcontrollerdb.txt "$APP/"
          cp -R .github/ios/Settings.bundle "$APP/Settings.bundle"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Package unsigned IPA
        run: |
          rm -rf ipa
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/DK64Recompiled.app
          (cd ipa && /usr/bin/zip -qry ../DK64Recompiled-iOS-unsigned.ipa Payload)
          unzip -l "DK64Recompiled-iOS-unsigned.ipa" | head -40

      - name: Verify IPA contents
        if: always()
        run: |
          IPA=DK64Recompiled-iOS-unsigned.ipa
          {
            echo "APP=$APP"
            ls -l "$IPA" || echo "IPA FILE MISSING"
            unzip -tq "$IPA" | tail -1
            unzip -l "$IPA" | tail -1
            unzip -l "$IPA" | awk 'NR>3 {print $1, $4}' | sort -rn | head -12
            BIN="$APP/DK64Recompiled"
            ls -l "$BIN"
            file "$BIN"
            lipo -info "$BIN" 2>&1
            plutil -lint "$APP/Info.plist"
            du -sh "$APP" "$APP/assets"
          } > ipa-report.txt 2>&1 || true
          MSG="$(sed 's/%/%25/g' ipa-report.txt | cut -c1-200 | awk '{printf "%s%%0A", $0}')"
          echo "::notice title=IPA report::${MSG:0:6000}"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DK64Recompiled-iOS-unsigned
          path: DK64Recompiled-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload IPA (unzipped)
        uses: actions/upload-artifact@v7
        with:
          path: DK64Recompiled-iOS-unsigned.ipa
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Publish IPA to private draft release
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" DK64Recompiled-iOS-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --prerelease \
            --title "iOS unsigned build #${GITHUB_RUN_NUMBER}" \
            --notes "Unsigned arm64 IPA built from ${GITHUB_SHA}." \
          || gh release upload "$TAG" DK64Recompiled-iOS-unsigned.ipa --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DK64Recompiled-iOS-build-diagnostics
          path: |
            build.log
            cmake-build-ios/CMakeCache.txt
            cmake-build-ios/**/*.log
          if-no-files-found: ignore
          retention-days: 7
