name: build-ios-ipa

on:
  push:
    branches: [iOS-port]
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: iOS-port

      - name: Get build inputs
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SECRET_NAME }}
          token: ${{ secrets.SECRET_TOKEN || github.token }}
          path: extra

      - name: Install host build dependencies
        run: |
          brew install ninja llvm
          echo "LLVM_ROOT=$(brew --prefix llvm)" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Prepare private build inputs
        run: |
          # The ROM is intentionally never copied into the runner workspace.
          # The private input repository contains only build-time/generated inputs.
          # Copy only the files/directories needed by the existing public source tree;
          # never overlay src/, include/, lib/, or other public project directories.
          test -f extra/us.toml
          test -f extra/n_aspMain.toml
          test -d extra/DK64Syms
          test -d extra/RecompiledFuncs
          test -d extra/rsp
          test -d extra/patches

          cp extra/us.toml .
          cp extra/n_aspMain.toml .
          cp -R extra/DK64Syms .
          cp -R extra/RecompiledFuncs .
          cp -R extra/rsp .
          cp -R extra/patches .

          # Assets/controller DB are distributable runtime resources, not ROM data.
          test -d extra/assets
          cp -R extra/assets .
          test -f extra/recompcontrollerdb.txt
          cp extra/recompcontrollerdb.txt .

      - name: Build SDL2 for iOS
        run: |
          SDL_VERSION=2.30.3
          curl -L "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz" -o SDL2.tar.gz
          tar -xzf SDL2.tar.gz
          cmake -S "SDL2-${SDL_VERSION}" -B SDL2-build -G Ninja             -DCMAKE_SYSTEM_NAME=iOS             -DCMAKE_OSX_SYSROOT=iphoneos             -DCMAKE_OSX_ARCHITECTURES=arm64             -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0             -DCMAKE_BUILD_TYPE=Release             -DSDL_TESTS=OFF             -DSDL_TESTS_ENABLED_BY_DEFAULT=OFF             -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/SDL2-install"
          cmake --build SDL2-build --config Release -j "$(sysctl -n hw.ncpu)"
          cmake --install SDL2-build

      - name: Bootstrap vcpkg
        run: |
          ./lib/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          ./lib/vcpkg/vcpkg install --triplet arm64-ios

      - name: Configure iOS
        run: |
          cmake -S . -B cmake-build-ios -G Xcode             -DCMAKE_SYSTEM_NAME=iOS             -DCMAKE_OSX_SYSROOT=iphoneos             -DCMAKE_OSX_ARCHITECTURES=arm64             -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/SDL2-install;$GITHUB_WORKSPACE/lib/vcpkg/installed/arm64-ios"             -DPATCHES_C_COMPILER="$LLVM_ROOT/bin/clang"             -DPATCHES_LD="$LLVM_ROOT/bin/ld.lld"

      - name: Build unsigned iOS app
        run: |
          cmake --build cmake-build-ios --config Release --target DK64Recompiled -j "$(sysctl -n hw.ncpu)" -- CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Assemble app resources
        run: |
          APP="$(find cmake-build-ios -type d -name 'DK64Recompiled.app' -print -quit)"
          test -n "$APP"
          mkdir -p "$APP/assets"
          cp -R assets/. "$APP/assets/"
          cp recompcontrollerdb.txt "$APP/"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Package unsigned IPA
        run: |
          rm -rf ipa
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/DK64Recompiled.app
          (cd ipa && /usr/bin/zip -qry ../DK64Recompiled-iOS-unsigned.ipa Payload)
          unzip -l "DK64Recompiled-iOS-unsigned.ipa" | head -40

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DK64Recompiled-iOS-unsigned
          path: DK64Recompiled-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DK64Recompiled-iOS-build-diagnostics
          path: |
            cmake-build-ios/CMakeCache.txt
            cmake-build-ios/**/*.log
          if-no-files-found: ignore
          retention-days: 7
